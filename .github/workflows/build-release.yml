name: Build and Release

# 触发条件:
#   1. 推送 v* 开头的 tag (如 v1.0.0) -> 打包并创建 Release
#   2. 手动触发 (workflow_dispatch)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # 创建 Release 需要

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller ipv4_config_manager.spec --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPv4ConfigManager-exe
          path: dist/IPv4ConfigManager.exe

      - name: Create Release and Upload exe
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IPv4ConfigManager.exe
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
